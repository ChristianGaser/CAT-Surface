name: Build and Test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autoconf-archive build-essential pkg-config zip zlib1g-dev
      - name: Configure
        run: |
          autoupdate
          autoreconf -fi
          # -fPIC is required, not an optimisation: the Python bindings below
          # link libCAT.a and libfftw3.a into shared extension modules, and on
          # x86-64 Linux a non-PIC object cannot go into a .so ("relocation
          # R_X86_64_PC32 ... can not be used when making a shared object").
          # A --disable-shared libtool build emits non-PIC objects by default,
          # so the flag has to be forced here.  CFLAGS is also forwarded to the
          # bundled FFTW3 sub-configure (see configure.ac), which needs it too.
          ./configure --enable-static --disable-shared \
            CFLAGS="-O2 -fPIC" CPPFLAGS="-O2"
      - name: Build
        run: make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
      - name: Test
        run: make check
      # The generated cat_surf/_*.c sources are build artifacts and are not
      # tracked, so nothing in the repository proves the .pyx sources still
      # cythonize, compile and link against libCAT.  These two steps are that
      # proof: the install cythonizes from scratch (Cython comes from
      # pyproject.toml's build-system.requires), and the smoke test imports
      # every extension module and checks the numeric contracts.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build Python bindings
        env:
          CAT_SURFACE_ROOT: ${{ github.workspace }}
          CAT_BUILD_DIR: ${{ github.workspace }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install ./cat_surface_cython

      - name: Smoke-test Python bindings
        run: python cat_surface_cython/tests/smoke_test.py

  # The unit tests again under AddressSanitizer and UndefinedBehaviorSanitizer,
  # with LeakSanitizer, which ASan enables on Linux: a leak in a tested path
  # fails the test, which matters because T1Prep runs libCAT in its own
  # process.  A sanitizer only sees the code the tests reach: test_readers,
  # test_hull and the long-path test in test_nifti reach the memory errors of
  # the 2026-10 audit, which an -O2 build runs through without a sign.
  sanitizers:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool autoconf-archive build-essential pkg-config zip zlib1g-dev
      - name: Configure
        run: |
          autoupdate
          autoreconf -fi
          # -fno-sanitize-recover makes undefined behaviour fail the test
          # instead of printing a line in its log.
          ./configure --enable-static --disable-shared \
            CFLAGS="-O1 -g -fno-omit-frame-pointer -fsanitize=address,undefined -fno-sanitize-recover=undefined" \
            LDFLAGS="-fsanitize=address,undefined"
      - name: Build
        run: make -j$(nproc)
      - name: Test
        run: make check || { cat tests/test-suite.log; exit 1; }
