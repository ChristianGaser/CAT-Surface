name: Build Binaries

on:
  workflow_dispatch:

jobs:
  # manylinux_2_28 (AlmaLinux 8, glibc 2.28) is far older than the bare
  # ubuntu-22.04 runner (glibc 2.35). manylinux2014 (glibc 2.17) cannot be
  # used because the GitHub Actions Node 24 runner requires glibc >= 2.28.
  # .github/glibc_compat.h pins the few symbols that glibc 2.27+ versioned
  # anew (expf, ...), so that the binaries also run on older systems such as
  # RHEL/CentOS 7; "Check the glibc floor" below enforces this.
  # -static-libgcc bundles the GCC runtime so binaries don't depend on the
  # host compiler libraries either.
  build_linux:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            arch: x64
            artifact: cat-surface-ubuntu-x86_64
            container_image: quay.io/pypa/manylinux_2_28_x86_64
          - os: ubuntu-22.04-arm
            arch: arm64
            artifact: cat-surface-ubuntu-arm64
            container_image: quay.io/pypa/manylinux_2_28_aarch64
    container:
      image: ${{ matrix.container_image }}

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y epel-release
          dnf install -y \
            git rsync zip \
            autoconf automake libtool autoconf-archive pkgconf-pkg-config make \
            gcc \
            fftw-devel

      - uses: actions/checkout@v6

      - name: Configure
        shell: bash
        run: |
          autoreconf -fi
          # CFLAGS (and not CPPFLAGS) also reach the bundled FFTW
          export CFLAGS="-O2 -include $PWD/.github/glibc_compat.h"
          export CPPFLAGS="-O2"
          export LDFLAGS="-static-libgcc"
          ./configure --enable-static --disable-shared --disable-doc

      - name: Build
        # On failure retry with a single job so the error appears
        # in sequence without being buried under fftw-build output.
        shell: bash
        run: make -j$(nproc) || make -j1

      - name: Verify binaries
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t bins < <(find Progs -maxdepth 1 -type f -executable -name 'CAT_*' ! -name '*_ui' | sort)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "No CAT binaries found in Progs/."
            exit 1
          fi

          for bin in "${bins[@]}"; do
            echo "Checking ${bin}"

            set +e
            timeout 5s "$bin" --help >/dev/null 2>&1
            rc=$?
            set -e

            if [ "$rc" -eq 126 ] || [ "$rc" -eq 127 ]; then
              echo "Execution failed for ${bin} (exit code ${rc})."
              exit 1
            fi

            deps="$(ldd "$bin" 2>&1 || true)"
            echo "$deps"

            if echo "$deps" | grep -qi "not found"; then
              echo "Missing runtime dependency detected in ${bin}."
              exit 1
            fi

            if echo "$deps" | grep -qiE 'fftw|gomp'; then
              echo "WARNING: Forbidden dynamic dependency detected in ${bin}." >&2
            fi
          done

      # The loader treats the glibc symbol versions a binary imports as a hard
      # minimum, and nothing on the build machine notices a raised floor.
      # glibc_compat.h pins the symbols that would raise it, and the floor below
      # is what remains: memcpy@GLIBC_2.14 on x86-64 and the aarch64 baseline.
      # Raise it only deliberately: it is the oldest Linux CAT runs on.
      - name: Check the glibc floor
        shell: bash
        run: |
          case "$(uname -m)" in
            x86_64)  max_allowed=2.14 ;;
            aarch64) max_allowed=2.17 ;;
            *)       echo "::error::unknown architecture $(uname -m)"; exit 1 ;;
          esac
          echo "builder: $(ldd --version | sed -n 1p)"
          status=0
          checked=0
          for f in $(find Progs -maxdepth 1 -type f -executable -name 'CAT_*' ! -name '*_ui' | sort); do
            name=$(basename "$f")
            imports=$(objdump -T "$f" |
                      sed -nE 's/.*[ (]GLIBC_([0-9][0-9.]*)\)?[[:space:]]+([A-Za-z_][A-Za-z0-9_]*)$/\1 \2/p' |
                      sort -uV)
            if [ -z "$imports" ]; then
              echo "::error::$name imports no versioned glibc symbol (is it dynamically linked?)"
              status=1
              continue
            fi
            checked=$((checked+1))
            highest=$(printf '%s\n' "$imports" | tail -n1 | cut -d' ' -f1)
            if [ "$(printf '%s\n%s\n' "$max_allowed" "$highest" | sort -V | tail -n1)" = "$max_allowed" ]; then
              echo "ok: $name needs at most GLIBC_$highest"
            else
              echo "::error::$name needs GLIBC_$highest, above the GLIBC_$max_allowed floor"
              printf '%s\n' "$imports" | sed 's/^/    GLIBC_/'
              status=1
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no binary was checked"
            status=1
          fi
          exit $status

      - name: Package binaries
        run: zip -r ${{ matrix.artifact }}.zip Progs

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  build_other:
    name: Build (${{ matrix.artifact }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos_target is the oldest macOS the binaries run on. Without it they
        # inherit the SDK version of the runner (macOS 15) as minimum and are
        # refused on older systems. arm64 starts at macOS 11, and 10.13 is the
        # oldest target the current Xcode supports.
        include:
          - os: macos-15
            arch: arm64
            artifact: cat-surface-macos-arm64
            macos_target: "11.0"
          - os: macos-15-intel
            arch: x64
            artifact: cat-surface-macos-x86
            macos_target: "10.13"
          - os: windows-latest
            arch: x64
            artifact: cat-surface-windows-x86

    steps:
      - uses: actions/checkout@v6

      # ---------------- Windows ----------------
      - name: Set up MSYS2
        if: matrix.os == 'windows-latest'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          install: >
            autoconf automake libtool autoconf-archive make zip
            mingw-w64-x86_64-toolchain mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-expat

      # ---------------- macOS ----------------
      - name: Install dependencies (macOS)
        if: startsWith(matrix.os, 'macos')
        run: brew install autoconf automake libtool autoconf-archive

      # ---------------- Configure ----------------
      - name: Configure (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: |
          autoupdate
          autoreconf -fi
          export {C,CPP}FLAGS="-O2"
          ./configure --enable-static --disable-shared --disable-doc

      - name: Configure (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          autoupdate
          autoreconf -fi
          export {C,CPP}FLAGS="-O2 -I/mingw64/include"
          export LDFLAGS="-L/mingw64/lib -static -static-libgcc"
          ./configure --enable-static --disable-shared --disable-doc --disable-openmp

      # ---------------- Build ----------------
      - name: Build (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
        run: make -j$(sysctl -n hw.ncpu)

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: make -j$(nproc)

      # ---------------- Verify binaries ----------------
      # Every binary has to run on matrix.macos_target. This fails if the
      # deployment target got lost somewhere (e.g. in a sub-configure).
      - name: Verify binaries (macOS)
        if: startsWith(matrix.os, 'macos')
        env:
          MACOS_TARGET: ${{ matrix.macos_target }}
        run: |
          status=0
          checked=0
          for bin in $(find Progs -maxdepth 1 -type f -perm -u+x -name 'CAT_*' ! -name '*_ui' | sort); do
            file "$bin" | grep -q 'Mach-O' || continue
            checked=$((checked+1))
            minos=$(otool -l "$bin" | awk '/LC_BUILD_VERSION/{b=1} b&&/minos/{print $2; exit} /LC_VERSION_MIN_MACOSX/{v=1} v&&/version/{print $2; exit}')
            if "$bin" --help </dev/null >/dev/null 2>&1; [ $? -ge 126 ]; then
              echo "::error::execution of $bin failed"
              status=1
            fi
            if [ -z "$minos" ]; then
              echo "::error::$bin has no minimum macOS version"
              status=1
            elif [ "$(printf '%s\n%s\n' "$MACOS_TARGET" "$minos" | sort -V | tail -n1)" != "$MACOS_TARGET" ]; then
              echo "::error::$bin needs macOS $minos, above the target $MACOS_TARGET"
              status=1
            else
              echo "ok: $bin needs macOS $minos"
            fi
          done
          if [ "$checked" -eq 0 ]; then
            echo "::error::no binary was checked"
            status=1
          fi
          exit $status

      - name: Verify binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: |
          set -euo pipefail

          mapfile -t bins < <(find Progs -maxdepth 1 -type f -name 'CAT_*.exe' | sort)
          if [ ${#bins[@]} -eq 0 ]; then
            echo "No CAT executables found in Progs/."
            exit 1
          fi

          for bin in "${bins[@]}"; do
            echo "Checking ${bin}"

            set +e
            "$bin" --help >/dev/null 2>&1
            rc=$?
            set -e

            if [ "$rc" -eq 126 ] || [ "$rc" -eq 127 ]; then
              echo "Execution failed for ${bin} (exit code ${rc})."
              exit 1
            fi

            deps="$(objdump -p "$bin" | sed -n 's/^[[:space:]]*DLL Name: //p' | tr '[:upper:]' '[:lower:]')"
            echo "$deps"

            if echo "$deps" | grep -qE 'fftw|gomp|winpthread'; then
              echo "ERROR: Forbidden dynamic dependency detected in ${bin}:" >&2
              echo "$deps" | grep -E 'fftw|gomp|winpthread' >&2
              exit 1
            fi
          done

      # ---------------- Package ----------------
      - name: Package binaries (macOS)
        if: startsWith(matrix.os, 'macos')
        run: zip -r ${{ matrix.artifact }}.zip Progs

      - name: Package binaries (Windows)
        if: matrix.os == 'windows-latest'
        shell: msys2 {0}
        run: zip -r ${{ matrix.artifact }}.zip Progs

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip
