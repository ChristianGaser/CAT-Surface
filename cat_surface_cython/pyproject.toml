[build-system]
# Build against the OLDEST NumPy 2.x that ships wheels for each Python.
# The NumPy 2.x C-ABI is backward compatible, so an extension built against
# the floor runs on every later 2.x at runtime (see the numpy>=2.0 runtime
# dependency below).  Pinning the floor also avoids resolving to a very new
# NumPy that has no prebuilt aarch64 wheel and would otherwise be compiled
# from source inside the manylinux_2_28 container, whose GCC 10.2.1 is too
# old (NumPy's meson build requires GCC >= 10.3).
requires = [
    "setuptools>=64",
    "wheel",
    "Cython>=3.0",
    "numpy>=2.0.0,<2.1; python_version < '3.13'",
    "numpy>=2.1.0,<2.2; python_version >= '3.13'",
]
build-backend = "setuptools.build_meta"

[project]
name = "cat-surf"
version = "1.0.15"
description = "Cython bindings to the CAT-Surface library (libCAT) for cortical surface analysis"
readme = "README.md"
license = "GPL-2.0-only"
requires-python = ">=3.9"
authors = [
    { name = "Christian Gaser", email = "christian.gaser@uni-jena.de" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: Cython",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
io = ["nibabel>=3.0"]

[project.urls]
Homepage = "https://github.com/ChristianGaser/CAT-Surface"
Repository = "https://github.com/ChristianGaser/CAT-Surface"

[tool.setuptools.packages.find]
include = ["cat_surf*"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-requires = "numpy"
test-command = "python -c \"import cat_surf; print('cat_surf', cat_surf.__version__, 'OK')\""
